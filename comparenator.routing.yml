comparenator.environment_compare:
  path: '/comparenator/env/{identifier}/{size}/{reference}/{current}'
  defaults:
    _controller: '\Drupal\comparenator\Controller\CompareController::envCompare'
    _title: 'Environment Comparison'
  requirements:
    _permission: 'view environment comparisons'
    identifier: '[A-Za-z0-9_-]+'
    size: '[A-Za-z0-9_-]+'
    reference: '[A-Za-z0-9_-]+'
    current: '[A-Za-z0-9_-]+'

comparenator.revision_compare:
  path: '/comparenator/node/{node}/{revA}/{revB}/{size}'
  defaults:
    _controller: '\Drupal\comparenator\Controller\CompareController::revisionCompare'
    _title: 'Revision Comparison'
  requirements:
    _permission: 'view node comparisons'
    _entity_access: 'node.view'
    node: '\d+'
    revA: '\d+'
    revB: '\d+'
    size: '[A-Za-z0-9_-]+'
  options:
    parameters:
      node:
        type: entity:node

comparenator.page_compare:
  path: '/comparenator/from-current'
  defaults:
    _controller: '\Drupal\comparenator\Controller\CompareController::pageCompare'
    _title: 'Comparenator'
  requirements:
    _permission: 'view environment comparisons'

comparenator.settings:
  path: '/admin/config/development/comparenator'
  defaults:
    _form: '\Drupal\comparenator\Form\SettingsForm'
    _title: 'Comparenator Settings'
  requirements:
    _permission: 'administer site configuration'
