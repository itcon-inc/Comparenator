comparenator.settings:
  type: config_object
  label: 'Comparenator settings'
  mapping:
    reference_site_url:
      type: string
      label: 'Reference environment base URL'
    current_site_url:
      type: string
      label: 'Local environment base URL'
    node_binary:
      type: string
      label: 'Node.js executable'
    retention_days:
      type: integer
      label: 'Screenshot retention in days'
    screen_sizes:
      type: sequence
      label: 'Viewport sizes'
      sequence:
        type: string
        label: 'Viewport dimensions'
